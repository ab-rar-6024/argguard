name: CI & Toolright Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Toolright globally
        run: npm install -g toolright
      - name: Run Monorepo Tests
        run: npm test
      - name: Lint MCP Fixture Descriptions with Toolright
        run: |
          toolright lint --tools fixtures/calendar-tools.json
          toolright lint --tools fixtures/messaging-tools.json
          toolright lint --tools fixtures/ticketing-tools.json
          toolright lint --tools fixtures/tuned-calendar-tools.json
